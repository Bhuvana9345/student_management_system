spring.application.name=student-management-system
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/student_management_system?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.jwt.secret=${APP_JWT_SECRET:change-this-secret-to-a-very-long-production-secret-key-123456789}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.upload-dir=uploads
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
springdoc.swagger-ui.path=/swagger-ui.html

spring.mail.host=localhost
spring.mail.port=1025
